[project]
name = "il-showtimes"
version = "0.1.0"
description = "Unofficial, read-only lookup of Israeli cinema showtimes (Cinema City, Planet) and restaurant availability (Ontopo). Never books."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
il-showtimes = "il_showtimes.cli:main"

[tool.setuptools]
packages = ["il_showtimes"]

[tool.pytest.ini_options]
pythonpath = ["."]
